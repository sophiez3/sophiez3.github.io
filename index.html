<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sophie Zhao | Portfolio</title>
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">
        <span class="brand-badge">[SZ]</span>
        <span>SOPHIE ZHAO</span>
      </a>
      <nav>
        <a href="index.html" class="active">Projects</a>
        <a href="about.html">About me</a>
        <a href="contact.html">Contact</a>
        <a href="resume.html">Resume</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero hero-compact">
      <div class="container hero-horizontal">
        <div class="hero-horizontal-text">
          <h1 class="serif-title">Welcome to Sophie Zhao's Portfolio!</h1>
          <p class="hero-sub">
            Computational Physics &amp; Computer Science at Carnegie Mellon University, Class of 2030
          </p>
        </div>
        <a href="#selected-work" class="btn-outline hero-cta">Explore my work &darr;</a>
      </div>
    </section>

    <section id="selected-work" class="section-block">
      <div class="container">
        <!-- Quick-Jump Project Index Tabs -->
        <div id="project-jump-tabs" class="project-jump-tabs" aria-label="Jump to project"></div>

        <div id="projects-container" class="projects-grid"></div>
      </div>
    </section>
  </main>

  <script src="projects-data.js?v=26"></script>
  <script>
    const jumpTabsContainer = document.getElementById("project-jump-tabs");
    const container = document.getElementById("projects-container");

    Object.entries(PROJECTS).forEach(([slug, p]) => {
      const tabBtn = document.createElement("button");
      tabBtn.type = "button";
      tabBtn.className = "jump-tab";
      tabBtn.innerHTML = `<span class="jump-num">${p.number}</span><span>${p.title}</span>`;
      tabBtn.addEventListener("click", () => {
        document.querySelectorAll(".jump-tab").forEach(t => t.classList.remove("active"));
        tabBtn.classList.add("active");

        const targetCard = document.getElementById(`card-${slug}`);
        if (targetCard) {
          targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
          targetCard.classList.remove("card-highlight-pulse");
          void targetCard.offsetWidth;
          targetCard.classList.add("card-highlight-pulse");
        }
      });
      jumpTabsContainer.appendChild(tabBtn);

      const skillsHtml = p.skills.map(s => `<span class="skill-pill">${s}</span>`).join("");
      const cardNotesHtml = (p.cardNotes && p.cardNotes.length > 0)
        ? `<div class="card-notes-list">${p.cardNotes.map(n => `<p class="card-dev-note">${n}</p>`).join("")}</div>`
        : "";
      const aiTransparencyHtml = p.aiTransparency
        ? `
          <div class="card-ai-box">
            <span class="card-ai-badge">${p.aiTransparency.badge}</span>
            <p class="card-ai-text">${p.aiTransparency.paragraphs.join(" ")}</p>
          </div>
        `
        : "";

      container.innerHTML += `
        <a id="card-${slug}" href="project.html?id=${slug}" class="project-card">
          <div>
            <div class="card-diagram">
              <span class="mono-label">${p.diagramHeader}</span>
              ${p.svgDiagram}
              <span class="mono-label" style="font-size:0.65rem; color:#64748b;">${p.diagramFooter}</span>
            </div>
            <div class="card-meta">
              <span class="mono-label mono-amber">${p.number}</span>
              <span class="mono-label">${p.category}</span>
            </div>
            <h3>${p.title}</h3>
            <p class="card-subtitle">${p.subtitle}</p>
            <p class="card-desc">${p.cardSummary}</p>
            ${cardNotesHtml}
            <div class="skill-pills">${skillsHtml}</div>
            ${aiTransparencyHtml}
          </div>
          <div class="card-footer">
            <span>View project details</span>
            <span>&nearr;</span>
          </div>
        </a>
      `;
    });
  </script>
  <script src="physics-interactions.js?v=26"></script>
</body>
</html>
